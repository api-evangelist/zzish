name: Zzish
description: >-
  Zzish is an EdTech company (a Techstars-backed startup) building a K-12 learning
  product suite used by teachers and students across 180 countries. Its flagship
  product, Quizalize, is a classroom quiz and formative-assessment platform; the
  portfolio also includes Blockerzz (a 3D game engine with quiz games and coding
  tutorials), Marvely.ai (AI-powered, exam-aligned language tutoring), Quizalize
  Insights (leadership dashboards for tracking academic progress), and QUAT (a
  customer-analytics platform for schools and EdTech partners). Zzish reports
  250k+ teachers onboarded in the last two years and 250m+ questions answered
  since launch. As of this enrichment pass, Zzish publishes no public developer
  API, OpenAPI, or developer-documentation surface.
